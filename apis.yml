name: Maple VC
description: 'Maple VC is an early-stage ("believing first") venture capital firm that writes first checks
  into founders at the seed stage, before their companies achieve mainstream recognition. The firm invests
  globally across four operator communities — San Francisco, Canada, Cambridge, and Korea — and is run by
  operators drawn from early teams at Uber, DigitalOcean, and Shopify. Notable portfolio companies include
  Clay, Neo Financial, AutoLeap, Playbook, BenchIQ, Finny, and Blacklake. Maple VC is a venture capital firm
  and does not operate a developer platform, public API, or API documentation.'
